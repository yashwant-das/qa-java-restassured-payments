server:
  port: ${PAYFLOWX_PORT:8080}

spring:
  application:
    name: payflowx-backend
  datasource:
    url: ${DB_URL:jdbc:h2:mem:payflowx;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      pool-name: PayFlowXBackendPool
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/seed-data.sql

payflowx:
  security:
    access-token: ${PAYFLOWX_ACCESS_TOKEN:payflowx-enterprise-token}
    signing-secret: ${PAYFLOWX_SIGNING_SECRET:payflowx-super-secret-signing-key}
    timestamp-skew-seconds: ${PAYFLOWX_TIMESTAMP_SKEW_SECONDS:300}
    provider-pin: ${PAYFLOWX_PROVIDER_PIN:4321}

logging:
  level:
    com.payflowx: INFO
