name: PayFlowX CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-analysis:
    name: Build and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile and run SpotBugs
        run: mvn -B -DskipTests verify

      - name: Archive SpotBugs reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: spotbugs-reports
          path: "**/target/spotbugsXml.xml"

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: payflowx
          MYSQL_USER: payflowx
          MYSQL_PASSWORD: payflowx
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Initialize MySQL schema
        run: |
          mysql -h 127.0.0.1 -uroot -proot payflowx < docker/mysql/schema.sql
          mysql -h 127.0.0.1 -uroot -proot payflowx < docker/mysql/seed-data.sql

      - name: Build backend
        run: mvn -B -pl backend -am -DskipTests package

      - name: Start backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/payflowx?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USERNAME: payflowx
          DB_PASSWORD: payflowx
          DB_DRIVER: com.mysql.cj.jdbc.Driver
        run: |
          java -jar backend/target/payflowx-backend-*.jar > backend.log 2>&1 &
          for i in {1..40}; do
            if curl -s -H "x-access-token: bad" http://localhost:8080/providers >/dev/null; then exit 0; fi
            sleep 3
          done
          cat backend.log
          exit 1

      - name: Run API automation
        env:
          PAYFLOWX_BASE_URI: http://localhost:8080
          DB_URL: jdbc:mysql://127.0.0.1:3306/payflowx?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USERNAME: payflowx
          DB_PASSWORD: payflowx
        run: mvn -B -pl automation test

      - name: Publish test summary
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: automation/target/surefire-reports/TEST-*.xml
          check_name: API test results
          detailed_summary: true
          include_passed: true

      - name: Generate Allure report
        if: always()
        run: mvn -B -pl automation allure:report

      - name: Archive Allure report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: automation/target/site/allure-maven-plugin

      - name: Upload Allure report for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && always()
        with:
          path: automation/target/site/allure-maven-plugin

      - name: Archive Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: automation/target/allure-results

      - name: Archive logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-logs
          path: |
            backend.log
            automation/target/logs

  publish-report:
    name: Publish Allure report
    needs: api-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
