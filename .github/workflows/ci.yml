name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install pinned hook runner
        run: python -m pip install pre-commit==4.7.0
      - name: Check all maintained files
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Validate Compose configuration
        run: docker compose config --quiet

  static-analysis:
    name: Build and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Compile and run SpotBugs
        run: ./mvnw -B -DskipTests verify

      - name: Archive SpotBugs reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: spotbugs-reports
          retention-days: 3
          path: "**/target/spotbugsXml.xml"

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      # The same commands as the README quickstart.
      - name: Start MySQL and the API
        run: docker compose up --build -d --wait mysql backend

      - name: Run API tests
        run: docker compose --profile test up --build --abort-on-container-exit --exit-code-from tests tests

      - name: Collect API logs
        if: always()
        run: docker compose logs backend > backend.log

      - name: Take ownership of test output
        if: always()
        run: |
          mkdir -p automation/target
          sudo chown -R "$(id -u):$(id -g)" automation/target

      - name: Publish test summary
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6
        if: always()
        with:
          report_paths: automation/target/surefire-reports/TEST-*.xml
          check_name: API test results
          detailed_summary: true
          include_passed: true

      - name: Generate Allure report
        if: always()
        run: ./mvnw -B -pl automation allure:report

      - name: Archive Allure report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: allure-report
          retention-days: 3
          path: automation/target/site/allure-maven-plugin

      - name: Upload Allure report for GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        with:
          path: automation/target/site/allure-maven-plugin
          retention-days: 3

      - name: Archive Allure results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: allure-results
          retention-days: 3
          path: automation/target/allure-results

      - name: Archive logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: execution-logs
          retention-days: 3
          path: |
            backend.log
            automation/target/logs

      - name: Stop containers
        if: always()
        run: docker compose --profile test down

  publish-report:
    name: Publish Allure report
    needs: [quality, static-analysis, api-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
