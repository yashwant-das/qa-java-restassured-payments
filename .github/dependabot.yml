version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      test-stack:
        patterns:
          - "io.rest-assured:*"
          - "org.testng:*"
          - "io.qameta.allure*"
          - "org.assertj:*"
      spring-boot:
        patterns:
          - "org.springframework.boot*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
